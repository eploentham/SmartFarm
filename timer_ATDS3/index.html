<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm Valve Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .valve-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .valve-card {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .valve-status {
            font-size: 1.2em;
            margin: 10px 0;
            padding: 5px;
            border-radius: 4px;
        }
        .status-on {
            background-color: #4CAF50;
            color: white;
        }
        .status-off {
            background-color: #f44336;
            color: white;
        }
        button {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #1976D2;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .time-display {
            text-align: center;
            font-size: 1.2em;
            margin: 20px 0;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Farm Valve Control</h1>
        <div class="time-display" id="currentTime">Loading time...</div>
        <div class="valve-grid" id="valveGrid">
            <!-- Valve cards will be generated here -->
        </div>
    </div>

    <script>
        // Function to update valve status
        function updateValveStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    for (let i = 1; i <= 8; i++) {
                        const valveCard = document.getElementById(`valve${i}`);
                        const statusElement = valveCard.querySelector('.valve-status');
                        const onButton = valveCard.querySelector('.on-button');
                        const offButton = valveCard.querySelector('.off-button');
                        
                        statusElement.textContent = data[`valve${i}`] ? 'ON' : 'OFF';
                        statusElement.className = `valve-status ${data[`valve${i}`] ? 'status-on' : 'status-off'}`;
                        
                        onButton.disabled = data[`valve${i}`];
                        offButton.disabled = !data[`valve${i}`];
                    }
                    document.getElementById('currentTime').textContent = `Current Time: ${data.time}`;
                })
                .catch(error => console.error('Error:', error));
        }

        // Function to control valve
        function controlValve(valveNumber, action) {
            fetch('/api/valve', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `valve=${valveNumber}&action=${action}`
            })
            .then(response => response.text())
            .then(result => {
                console.log('Valve control result:', result);
                updateValveStatus();
            })
            .catch(error => console.error('Error:', error));
        }

        // Create valve cards
        const valveGrid = document.getElementById('valveGrid');
        for (let i = 1; i <= 8; i++) {
            const valveCard = document.createElement('div');
            valveCard.className = 'valve-card';
            valveCard.id = `valve${i}`;
            valveCard.innerHTML = `
                <h3>Valve ${i}</h3>
                <div class="valve-status status-off">OFF</div>
                <button class="on-button" onclick="controlValve(${i}, 'on')">Turn ON</button>
                <button class="off-button" disabled onclick="controlValve(${i}, 'off')">Turn OFF</button>
            `;
            valveGrid.appendChild(valveCard);
        }

        // Update status every 2 seconds
        setInterval(updateValveStatus, 2000);
        updateValveStatus(); // Initial update
    </script>
</body>
</html>
